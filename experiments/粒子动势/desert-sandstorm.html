<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沙漠行驶 · 湍流沙暴</title>
<style>
  :root{ --bg:#14100c; --panel:#241c14; --line:#3a2d1f; --fg:#e8dcc8; --dim:#8b7a5e; --accent:#e8b64c; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
             font:12px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  #scene{ display:block; position:fixed; inset:0; width:100%; height:100%; }

  .panel{
    position:fixed; top:16px; right:16px; width:310px; max-height:calc(100vh - 32px);
    overflow-y:auto; z-index:10; user-select:none;
    background:linear-gradient(180deg,rgba(36,28,20,.94) 0%,rgba(23,19,16,.94) 100%);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border:1px solid var(--line); border-radius:14px; padding:12px 14px 14px;
    box-shadow:0 18px 50px rgba(0,0,0,.6);
  }
  .panel::-webkit-scrollbar{ width:6px; }
  .panel::-webkit-scrollbar-thumb{ background:#4a3a26; border-radius:3px; }
  .head h1{ font-size:14px; font-weight:600; letter-spacing:2px; color:#f0d9a8; }
  .head .sub{ font-size:10.5px; color:var(--dim); margin:3px 0 8px; letter-spacing:1px; }
  .head h1::before{ content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
        background:var(--accent); margin-right:8px; vertical-align:2px; box-shadow:0 0 9px var(--accent); }

  .sec{ font-size:11px; color:#d1b27a; margin:9px 0 3px; padding-bottom:3px;
        border-bottom:1px dashed var(--line); letter-spacing:1px; }
  .ctrl{ margin-bottom:3px; }
  .ctrl .row{ display:flex; justify-content:space-between; align-items:baseline;
              font-size:11.5px; color:#b9a888; }
  .ctrl .row b{ font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:3px; border-radius:2px;
        background:var(--line); outline:none; margin:5px 0 1px; cursor:pointer; display:block; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
        background:linear-gradient(180deg,#f2c96a,#d99c2c); cursor:pointer;
        box-shadow:0 0 0 3px rgba(232,182,76,.15),0 1px 3px rgba(0,0,0,.6); }
  input[type=range]::-moz-range-thumb{ width:12px; height:12px; border:none; border-radius:50%;
        background:linear-gradient(180deg,#f2c96a,#d99c2c); cursor:pointer;
        box-shadow:0 0 0 3px rgba(232,182,76,.15); }

  .btns{ display:flex; gap:6px; margin-top:10px; }
  .btns button{ flex:1; padding:7px 0; border-radius:8px; cursor:pointer; font-family:inherit;
        border:1px solid #4a3a26; background:linear-gradient(180deg,#33281a,#241b12);
        color:#e0d0ae; font-size:11.5px; letter-spacing:.5px; transition:.15s; }
  .btns button:hover{ background:linear-gradient(180deg,#443423,#2c2016); border-color:#6b5333; color:#f5e4bd; }
  .btns button:active{ transform:translateY(1px); }
  .btns button.on{ border-color:rgba(232,182,76,.6); color:#f5d98f; background:#3a2b18; }
  .seedline{ margin-top:9px; font-size:10.5px; color:#f0d9a8; font-variant-numeric:tabular-nums; }
  .note{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line);
         font-size:10.5px; color:#7d6e55; line-height:1.6; }

  @media (max-width:760px){
    .panel{ width:auto; left:12px; right:12px; top:auto; bottom:12px; max-height:52vh; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<aside class="panel">
  <div class="head">
    <h1>沙漠行驶 · 湍流沙暴</h1>
    <div class="sub">沙 暴 旋 涡 · 持续喷发 / 时间消散 / 湍流乱流</div>
  </div>

  <div class="sec">车 辆 动 力</div>
  <div class="ctrl"><div class="row"><span>轮子转速（车速）</span><b id="v-speed">350</b></div><input type="range" id="r-speed" min="0" max="600" step="1" value="350"></div>
  <div class="ctrl"><div class="row"><span>车身自转速度</span><b id="v-spin">0.00</b></div><input type="range" id="r-spin" min="0" max="3.0" step="0.05" value="0"></div>
  <div class="ctrl"><div class="row"><span>喷射开角</span><b id="v-spread">0.50</b></div><input type="range" id="r-spread" min="0.1" max="2.5" step="0.05" value="0.5"></div>

  <div class="sec">空 气 湍 流</div>
  <div class="ctrl"><div class="row"><span>湍流强度</span><b id="v-turb">0.1</b></div><input type="range" id="r-turb" min="0" max="5.0" step="0.1" value="0.1"></div>

  <div class="sec">沙 粒 参 数</div>
  <div class="ctrl"><div class="row"><span>沙粒生成量</span><b id="v-sand-rate">400</b></div><input type="range" id="r-sand-rate" min="0" max="3000" step="10" value="400"></div>
  <div class="ctrl"><div class="row"><span>沙粒消散时间（秒）</span><b id="v-sand-life">1.2</b></div><input type="range" id="r-sand-life" min="0.2" max="6.0" step="0.1" value="1.2"></div>
  <div class="ctrl"><div class="row"><span>沙粒大小</span><b id="v-sand-size">0.4</b></div><input type="range" id="r-sand-size" min="0.2" max="6.0" step="0.1" value="0.4"></div>
  <div class="ctrl"><div class="row"><span>喷射力度</span><b id="v-sand-power">2.0</b></div><input type="range" id="r-sand-power" min="0.2" max="5.0" step="0.1" value="2.0"></div>

  <div class="sec">尘 土 参 数</div>
  <div class="ctrl"><div class="row"><span>尘土生成量</span><b id="v-dust-rate">200</b></div><input type="range" id="r-dust-rate" min="0" max="1000" step="10" value="200"></div>
  <div class="ctrl"><div class="row"><span>尘土消散时间（秒）</span><b id="v-dust-life">4.0</b></div><input type="range" id="r-dust-life" min="0.2" max="8.0" step="0.1" value="4.0"></div>

  <div class="sec">沙 丘 地 形</div>
  <div class="ctrl"><div class="row"><span>沙丘对比度</span><b id="v-contrast">0.5</b></div><input type="range" id="r-contrast" min="0.1" max="3.0" step="0.05" value="0.5"></div>

  <div class="btns">
    <button id="btn-pause">暂停</button>
    <button id="btn-reset">重置参数</button>
    <button id="btn-seed">重置种子</button>
  </div>
  <div class="seedline" id="seedInfo">种子 #42 · 重置后粒子序列可复现</div>
  <div class="note">沙丘由 fbm 噪声高度场程序化生成，无外部素材；沙粒与尘土自车尾两侧持续喷发，按寿命消散并受确定性噪声湍流扰动。暂停态拖滑杆也会立即重绘。</div>
</aside>

<script>

"use strict";
(function(){

/* ===================== 工具 ===================== */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b-a)*t;
function roundRectPath(c,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,   x+w,y+h, r);
  c.arcTo(x+w,y+h, x,  y+h, r);
  c.arcTo(x,  y+h, x,  y,   r);
  c.arcTo(x,  y,   x+w,y,   r);
  c.closePath();
}

/* ===================== 噪声 ===================== */
function hash2(x,y){
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  h = h ^ (h>>>16);
  return (h>>>0) / 4294967295;
}
function vnoise(x,y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2(xi,yi),   b = hash2(xi+1,yi);
  const c = hash2(xi,yi+1), d = hash2(xi+1,yi+1);
  return lerp(lerp(a,b,u), lerp(c,d,u), v);
}
function fbm(x,y,oct){
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for(let i = 0; i < oct; i++){
    s += amp * vnoise(x*f, y*f);
    norm += amp; f *= 2.03; amp *= 0.5;
  }
  return s / norm;
}

/* ===================== DOM & 状态 ===================== */
const canvas = document.getElementById('scene');
const ctx    = canvas.getContext('2d', { alpha: false });

let W = 800, H = 600, DPR = 1;

let seed = 42;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let rng = mulberry32(seed);
let simTime = 0;
let needRedraw = true;
function requestRedraw(){ needRedraw = true; }

const params = {
  speed: 350,
  spinSpeed: 0,
  spreadAngle: 0.5,
  turbulence: 0.1,
  sandRate: 400,
  sandLife: 1.2,
  sandSize: 0.4,
  sandPower: 2.0,
  dustRate: 200,
  dustLife: 4.0,
  contrast: 0.5,
  paused: false
};

const car = {
  x: 400, y: 300,
  angle: 0,
  wheelRotation: 0
};

/* ===================== 地形 ===================== */
let terrainCanvas = null, terrainCtx = null;
let heightField = null, hgw = 0, hgh = 0;
const HSC = 3;
let vignette = null;

function computeHeightField(){
  hgw = Math.ceil(W / HSC) + 2;
  hgh = Math.ceil(H / HSC) + 2;
  heightField = new Float32Array(hgw * hgh);
  const fx = 0.0042, fy = 0.0068;
  for(let y = 0; y < hgh; y++){
    const wy = (y - 1) * HSC * fy;
    for(let x = 0; x < hgw; x++){
      const wx = (x - 1) * HSC * fx;
      heightField[y * hgw + x] = fbm(wx, wy, 4);
    }
  }
}

function renderTerrain(){
  if(!heightField) return;
  const gw = hgw, gh = hgh;

  const small = document.createElement('canvas');
  small.width = gw; small.height = gh;
  const sctx = small.getContext('2d');
  const img = sctx.createImageData(gw, gh);
  const px = img.data;
  const K = 9.0 * params.contrast;

  for(let y = 0; y < gh; y++){
    const ym = y > 0 ? y - 1 : 0;
    const yp = y < gh - 1 ? y + 1 : gh - 1;
    for(let x = 0; x < gw; x++){
      const xm = x > 0 ? x - 1 : 0;
      const xp = x < gw - 1 ? x + 1 : gw - 1;
      const i = y * gw + x;

      const dx = heightField[y * gw + xp] - heightField[y * gw + xm];
      const dy = heightField[yp * gw + x] - heightField[ym * gw + x];

      let sh = (dx * 0.90 + dy * 0.75) * K;
      sh = sh > 1 ? 1 : (sh < -1 ? -1 : sh);

      const t = 0.5 + sh * 0.5;
      let r, g, b;
      if(t < 0.5){
        const k = t * 2;
        r = lerp(176, 224, k); g = lerp(138, 192, k); b = lerp(88, 138, k);
      }else{
        const k = (t - 0.5) * 2;
        r = lerp(224, 249, k); g = lerp(192, 236, k); b = lerp(138, 198, k);
      }
      const o = i * 4;
      px[o] = r; px[o+1] = g; px[o+2] = b; px[o+3] = 255;
    }
  }
  sctx.putImageData(img, 0, 0);

  const dw = Math.max(1, Math.round(W * DPR));
  const dh = Math.max(1, Math.round(H * DPR));
  if(!terrainCanvas){
    terrainCanvas = document.createElement('canvas');
    terrainCtx = terrainCanvas.getContext('2d', { alpha: false });
  }
  if(terrainCanvas.width !== dw || terrainCanvas.height !== dh){
    terrainCanvas.width = dw;
    terrainCanvas.height = dh;
    terrainCtx = terrainCanvas.getContext('2d', { alpha: false });
  }else{
    terrainCtx.clearRect(0, 0, dw, dh);
  }
  terrainCtx.imageSmoothingEnabled = true;
  terrainCtx.imageSmoothingQuality = 'high';

  const sc = HSC * DPR;
  terrainCtx.drawImage(small, 0, 0, gw, gh, -sc, -sc, gw * sc, gh * sc);
}

function buildTerrain(){
  computeHeightField();
  renderTerrain();
}

/* ===================== 尘土精灵 ===================== */
let puffSprite = null;
function makePuffSprite(){
  const s = 128;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grd.addColorStop(0.00, 'rgba(248,232,200,0.5)');
  grd.addColorStop(0.35, 'rgba(240,219,180,0.25)');
  grd.addColorStop(0.70, 'rgba(230,205,162,0.1)');
  grd.addColorStop(1.00, 'rgba(222,196,152,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  return c;
}

/* ===================== 粒子系统 ===================== */
const grains = [];
const dusts  = [];

const MAX_GRAINS = 5000;
const MAX_DUSTS  = 1500;

let sandAcc = 0;
let dustAcc = 0;

const SAND_COLORS = ['#fff3d4', '#efd7a3', '#d8ba82', '#b9975f'];

function emitParticles(dt){
  const c = Math.cos(car.angle), s = Math.sin(car.angle);
  const backAng = car.angle + Math.PI;

  const speedFactor = 0.1 + params.speed / 250;

  /* ---- 沙粒 ---- */
  sandAcc += params.sandRate * speedFactor * dt;
  let n = Math.floor(sandAcc);
  sandAcc -= n;
  if(n > 200) n = 200;

  for(let i = 0; i < n; i++){
    if(grains.length >= MAX_GRAINS) break;

    const side = rng() < 0.5 ? -1 : 1;
    const lx = -13 + (rng() - 0.5) * 6;
    const ly = side * (12 + (rng() - 0.5) * 4);
    const wx = car.x + lx * c - ly * s;
    const wy = car.y + lx * s + ly * c;

    const spread = (rng() - 0.5) * params.spreadAngle;
    const ang = backAng + spread;
    const spd = (15 + rng() * 60) * params.sandPower * speedFactor;

    const lifeMax = params.sandLife * (0.6 + rng() * 0.8);

    grains.push({
      x: wx, y: wy,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 0,
      maxLife: lifeMax,
      size: (0.8 + rng() * 1.5) * params.sandSize,
      grow: 1.5 + rng() * 2.5,
      drag: 1.5 + rng() * 1.5,
      ci: (rng() * 4) | 0,
      alpha: 0.6 + rng() * 0.4
    });
  }

  /* ---- 尘土 ---- */
  dustAcc += params.dustRate * speedFactor * dt;
  let m = Math.floor(dustAcc);
  dustAcc -= m;
  if(m > 50) m = 50;

  for(let i = 0; i < m; i++){
    if(dusts.length >= MAX_DUSTS) break;

    const side = rng() < 0.5 ? -1 : 1;
    const lx = -15 + (rng() - 0.5) * 10;
    const ly = side * (10 + rng() * 8);
    const wx = car.x + lx * c - ly * s;
    const wy = car.y + lx * s + ly * c;

    const spread = (rng() - 0.5) * params.spreadAngle * 1.2;
    const ang = backAng + spread;
    const spd = (10 + rng() * 30) * params.sandPower * speedFactor;

    const lifeMax = params.dustLife * (0.6 + rng() * 0.8);

    dusts.push({
      x: wx, y: wy,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 0,
      maxLife: lifeMax,
      size: (15 + rng() * 25) * (0.6 + params.sandSize * 0.4),
      drag: 0.6 + rng() * 0.5,
      alpha: 0.15 + rng() * 0.2
    });
  }
}

function updateParticles(dt){
  const time = simTime;
  const turb = params.turbulence;
  const noiseScale = 0.004;

  // --- 更新沙粒 ---
  for(let i = grains.length - 1; i >= 0; i--){
    const p = grains[i];
    p.life += dt;
    if(p.life >= p.maxLife){
      grains[i] = grains[grains.length - 1];
      grains.pop();
      continue;
    }

    const drag = Math.exp(-p.drag * dt);
    p.vx *= drag;
    p.vy *= drag;

    if(turb > 0){
      const nx = p.x * noiseScale;
      const ny = p.y * noiseScale;
      const tAng = vnoise(nx + time, ny - time) * Math.PI * 6;
      const tForce = turb * 250 * dt;
      p.vx += Math.cos(tAng) * tForce;
      p.vy += Math.sin(tAng) * tForce;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if(p.x < -300 || p.x > W+300 || p.y < -300 || p.y > H+300){
      grains[i] = grains[grains.length - 1];
      grains.pop();
    }
  }

  // --- 更新尘土 ---
  for(let i = dusts.length - 1; i >= 0; i--){
    const p = dusts[i];
    p.life += dt;
    if(p.life >= p.maxLife){
      dusts[i] = dusts[dusts.length - 1];
      dusts.pop();
      continue;
    }

    const drag = Math.exp(-p.drag * dt);
    p.vx *= drag;
    p.vy *= drag;

    if(turb > 0){
      const nx = p.x * noiseScale;
      const ny = p.y * noiseScale;
      const tAng = vnoise(nx - time, ny + time) * Math.PI * 6;
      const tForce = turb * 350 * dt;
      p.vx += Math.cos(tAng) * tForce;
      p.vy += Math.sin(tAng) * tForce;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if(p.x < -400 || p.x > W+400 || p.y < -400 || p.y > H+400){
      dusts[i] = dusts[dusts.length - 1];
      dusts.pop();
    }
  }
}

function drawParticles(){
  if(puffSprite){
    for(let i = 0; i < dusts.length; i++){
      const p = dusts[i];
      const t = p.life / p.maxLife;
      const a = p.alpha * Math.pow(1 - t, 1.5);
      if(a < 0.003) continue;

      const r = p.size * (0.8 + t * 1.8);
      ctx.globalAlpha = a;
      ctx.drawImage(puffSprite, p.x - r, p.y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }

  let lastCi = -1;
  for(let i = 0; i < grains.length; i++){
    const p = grains[i];
    const t = p.life / p.maxLife;
    const a = p.alpha * (1 - t) * (1 - t);
    if(a < 0.02) continue;

    const ease = 1 - (1 - t) * (1 - t);
    const r = p.size * (0.4 + ease * p.grow);

    ctx.globalAlpha = a;
    if(p.ci !== lastCi){ ctx.fillStyle = SAND_COLORS[p.ci]; lastCi = p.ci; }

    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ===================== 车辆与轮子 ===================== */
function updateCar(dt){
  car.angle += params.spinSpeed * dt;
  car.wheelRotation = (car.wheelRotation + params.speed * 0.04 * dt) % 1000;
}

function drawCar(){
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);

  ctx.save();
  ctx.translate(4, 5);
  ctx.fillStyle = 'rgba(84,54,16,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 24, 13, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  const wheels = [
    { x: -13, y: -12 }, { x: 13, y: -12 },
    { x: -13, y: 12 },  { x: 13, y: 12 }
  ];

  for(let i = 0; i < wheels.length; i++){
    ctx.save();
    ctx.translate(wheels[i].x, wheels[i].y);

    ctx.fillStyle = '#1c140e';
    roundRectPath(ctx, -7.5, -3.5, 15, 7, 2.5);
    ctx.fill();

    ctx.save();
    roundRectPath(ctx, -7.5, -3.5, 15, 7, 2.5);
    ctx.clip();

    ctx.strokeStyle = '#423022';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    const period = 4;
    const offset = (car.wheelRotation * 15) % period;
    for(let k = -12; k <= 12; k += period){
      const px = k + offset;
      ctx.moveTo(px, -4);
      ctx.lineTo(px, 4);
    }
    ctx.stroke();

    ctx.strokeStyle = '#2b1d14';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.lineTo(7, 0);
    ctx.stroke();

    ctx.restore();
    ctx.restore();
  }

  const bodyGrad = ctx.createLinearGradient(0, -12, 0, 12);
  bodyGrad.addColorStop(0.00, '#f0735a');
  bodyGrad.addColorStop(0.42, '#cf3a24');
  bodyGrad.addColorStop(1.00, '#87200f');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(24, 0);
  ctx.quadraticCurveTo(24, -9, 13, -11);
  ctx.lineTo(-16, -11);
  ctx.quadraticCurveTo(-22, -11, -22, -5);
  ctx.lineTo(-22, 5);
  ctx.quadraticCurveTo(-22, 11, -16, 11);
  ctx.lineTo(13, 11);
  ctx.quadraticCurveTo(24, 9, 24, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = 'rgba(178,224,240,0.88)';
  ctx.beginPath();
  ctx.moveTo(12.5, -7.5);
  ctx.lineTo(18.5, -5.2);
  ctx.lineTo(18.5, 5.2);
  ctx.lineTo(12.5, 7.5);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  roundRectPath(ctx, -13, -8, 23, 16, 5);
  ctx.fill();

  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-12, 0);
  ctx.lineTo(11, 0);
  ctx.stroke();

  ctx.fillStyle = '#ffe9a8';
  ctx.beginPath(); ctx.arc(20.5, -4.6, 2.0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(20.5,  4.6, 2.0, 0, TAU); ctx.fill();

  ctx.restore();
}

/* ===================== 渲染 ===================== */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;

  if(terrainCanvas) ctx.drawImage(terrainCanvas, 0, 0, W, H);
  drawParticles();
  drawCar();

  if(vignette){
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ===================== 主循环 ===================== */
let lastT = 0;
function loop(t){
  if(!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if(dt > 0.05) dt = 0.05;

  if(!params.paused){
    simTime += dt;
    updateCar(dt);
    emitParticles(dt);
    updateParticles(dt);
    needRedraw = true;
  }
  if(needRedraw){ render(); needRedraw = false; }
  requestAnimationFrame(loop);
}

/* ===================== 尺寸 ===================== */
function resize(){
  const VW = window.innerWidth, VH = window.innerHeight;
  W = VW; H = VH;
  DPR = window.devicePixelRatio || 1;

  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  buildTerrain();

  vignette = ctx.createRadialGradient(
    W / 2, H / 2, Math.min(W, H) * 0.3,
    W / 2, H / 2, Math.max(W, H) * 0.85
  );
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(52,30,6,0.4)');

  /* 宽屏时车辆居中于面板左侧安全区，避免被固定面板遮挡 */
  const safeRight = VW > 760 ? 342 : 0;
  car.x = (VW - safeRight) / 2;
  car.y = VW > 760 ? VH / 2 : VH * 0.42;
  requestRedraw();
}

let resizeTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 60);
});

/* ===================== 控件 ===================== */
function bindRange(id, key, outId, fmt, after){
  const el  = document.getElementById(id);
  const out = document.getElementById(outId);
  if(!el) return;
  function apply(){
    params[key] = parseFloat(el.value);
    if(out) out.textContent = fmt(params[key]);
    if(after) after();
    requestRedraw();
  }
  el.addEventListener('input', apply);
  apply();
}

bindRange('r-speed',     'speed',     'v-speed',     v => Math.round(v));
bindRange('r-spin',      'spinSpeed', 'v-spin',      v => v.toFixed(2));
bindRange('r-spread',    'spreadAngle','v-spread',   v => v.toFixed(2));
bindRange('r-turb',      'turbulence','v-turb',      v => v.toFixed(1));
bindRange('r-sand-rate', 'sandRate',  'v-sand-rate', v => Math.round(v));
bindRange('r-sand-life', 'sandLife',  'v-sand-life', v => v.toFixed(1));
bindRange('r-sand-size', 'sandSize',  'v-sand-size', v => v.toFixed(1));
bindRange('r-sand-power','sandPower', 'v-sand-power',v => v.toFixed(1));
bindRange('r-dust-rate', 'dustRate',  'v-dust-rate', v => Math.round(v));
bindRange('r-dust-life', 'dustLife',  'v-dust-life', v => v.toFixed(1));

(function(){
  const el  = document.getElementById('r-contrast');
  const out = document.getElementById('v-contrast');
  function apply(){
    params.contrast = parseFloat(el.value);
    out.textContent = params.contrast.toFixed(1);
    renderTerrain();
    requestRedraw();
  }
  el.addEventListener('input', apply);
  apply();
})();

const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', function(){
  params.paused = !params.paused;
  btnPause.textContent = params.paused ? '继续' : '暂停';
  btnPause.classList.toggle('on', params.paused);
  requestRedraw();
});

document.getElementById('btn-reset').addEventListener('click', function(){
  grains.length = 0;
  dusts.length = 0;
  sandAcc = 0;
  dustAcc = 0;
  car.angle = 0;
  car.wheelRotation = 0;

  document.getElementById('r-speed').value = 350;
  document.getElementById('r-spin').value = 0;
  document.getElementById('r-spread').value = 0.5;
  document.getElementById('r-turb').value = 0.1;
  document.getElementById('r-sand-rate').value = 400;
  document.getElementById('r-sand-life').value = 1.2;
  document.getElementById('r-sand-size').value = 0.4;
  document.getElementById('r-sand-power').value = 2.0;
  document.getElementById('r-dust-rate').value = 200;
  document.getElementById('r-dust-life').value = 4.0;
  document.getElementById('r-contrast').value = 0.5;

  document.querySelectorAll('input[type=range]').forEach(el => {
    el.dispatchEvent(new Event('input'));
  });

  buildTerrain();
  requestRedraw();
});

/* ===================== 重置种子 ===================== */
document.getElementById('btn-seed').addEventListener('click', function(){
  seed = Math.floor(Math.random() * 1e9);
  rng = mulberry32(seed);
  simTime = 0;
  grains.length = 0; dusts.length = 0;
  sandAcc = 0; dustAcc = 0;
  document.getElementById('seedInfo').textContent = `种子 #${seed} · 重置后粒子序列可复现`;
  requestRedraw();
});

/* ===================== 启动 ===================== */
puffSprite = makePuffSprite();
resize();
render();                 /* 同步补画首帧，避免无人值守截图闪现空画布 */
needRedraw = false;
if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){
  params.paused = true;
  btnPause.textContent = '继续';
  btnPause.classList.add('on');
}
requestAnimationFrame(loop);

})();

</script>
</body>
