<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>启动动画 · Launch Splash</title>
<style>
  /* ==================================================
     动效时长 / 延迟一律走 CSS 变量（单位 ms），滑杆只改变量
     ================================================== */
  :root {
    --dur-logo: 1000ms;

    --dur-icon: 500ms;
    --dur-text: 500ms;
    --dur-sub: 400ms;

    --delay-text: 0ms;
    --delay-sub: 400ms;

    --stagger-text: 0ms;
    --stagger-sub: 0ms;

    --acc: #1DB954;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #121212;
    height: 100vh;
    display: flex;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }

  /* ====== 左侧 16:9 预览画布 ====== */
  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background-color: #1a1a1a;
    overflow: hidden;
  }

  .screen {
    width: 100%;
    max-width: 1024px;
    aspect-ratio: 16 / 9;
    background-color: #000;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
    border: 1px solid #333;
    border-radius: 4px;
    overflow: hidden;
    container-type: size;      /* 内部尺寸用 cqw，跟着画布缩放 */
  }

  /* ====== 右侧参数面板 ====== */
  .control-panel {
    width: 340px;
    flex: 0 0 340px;
    background: #1e1e1e;
    border-left: 1px solid #333;
    display: flex;
    flex-direction: column;
    padding: 20px 22px 22px;
    overflow-y: auto;
    box-shadow: -5px 0 20px rgba(0, 0, 0, .3);
    z-index: 100;
  }

  .panel-title { font-size: 17px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .panel-desc { font-size: 11.5px; color: #888; margin-bottom: 14px; line-height: 1.55; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: #2a2a2a; padding: 4px; border-radius: 8px; }
  .tab-btn {
    flex: 1; padding: 7px 0; border: none; background: transparent;
    border-radius: 6px; font-size: 13px; color: #aaa; cursor: pointer; transition: .2s;
    font-weight: 500; font-family: inherit;
  }
  .tab-btn.active { background: #444; color: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); }

  .slider-group { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #333; }
  .slider-group:last-child { border-bottom: none; }
  .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12.5px; color: #ccc; }
  .slider-value {
    font-family: ui-monospace, Consolas, monospace; color: var(--acc); font-weight: bold;
    background: rgba(29, 185, 84, .15); padding: 2px 6px; border-radius: 4px; font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  input[type=range] { width: 100%; accent-color: var(--acc); cursor: pointer; }

  .total-duration-panel {
    background: var(--acc);
    color: #fff;
    padding: 12px 16px;
    border-radius: 10px;
    margin: 12px 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 12px rgba(29, 185, 84, .2);
  }
  .total-label { font-size: 13px; font-weight: 500; opacity: .9; }
  .total-value { font-size: 20px; font-weight: bold; font-family: ui-monospace, Consolas, monospace; }

  .replay-btn {
    padding: 10px;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
    font-family: inherit;
  }
  .replay-btn:hover { background: #555; transform: translateY(-1px); }

  /* ==================================================
     画布内部元素（cqw = 画布宽度的 1%，随预览缩放）
     ================================================== */
  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    top: -2.5%;
    padding: 2cqw;
  }

  .logo-wrap {
    width: 22.46cqw;
    max-width: 460px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.2cqw;
    position: relative;
  }

  /* 光晕挂外层、入场挂内层：两个动画不能同时动 filter */
  .icon-box { display: block; flex-shrink: 0; }
  .logo-icon {
    display: block;
    width: 4.8cqw; height: 4.8cqw; max-width: 100px; max-height: 100px;
    overflow: visible;
  }

  .icon-bg { fill: url(#gradient); }
  .icon-stroke { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .icon-dot { fill: #fff; }

  .logo-text {
    font-size: 3.6cqw; font-weight: 800; color: #fff; line-height: 1;
    letter-spacing: .02em; white-space: nowrap; display: flex; position: relative;
  }
  .logo-text span { display: inline-block; opacity: 0; will-change: transform, opacity, filter; }

  .tagline {
    display: flex; justify-content: space-between;
    width: 21.387cqw; max-width: 438px;
    font-size: 1.416cqw; line-height: 1; margin-top: 1.5cqw;
    color: #8a8a8a; font-weight: 400; position: relative;
  }
  .tagline span { display: inline-block; opacity: 0; will-change: transform, opacity, filter; }

  /* ==================================================
     关键帧
     ================================================== */
  /* 方案 1 · 呼吸微光 */
  @keyframes anim1-icon { 0% { opacity: 0; transform: translateY(35%) scale(.92); filter: blur(6px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
  @keyframes anim1-breathe { 0%, 100% { filter: drop-shadow(0 0 12px rgba(255, 51, 102, .4)); } 50% { filter: drop-shadow(0 0 26px rgba(178, 36, 239, .7)); } }
  @keyframes anim1-text { 0% { opacity: 0; transform: translateY(40%); filter: blur(2px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }

  /* 方案 3 · 弹性错位 */
  @keyframes anim3-icon { 0% { opacity: 0; transform: scale(.5); filter: blur(8px); } 60% { opacity: 1; transform: scale(1.1); filter: blur(0); } 100% { opacity: 1; transform: scale(1); filter: blur(0); } }
  @keyframes anim3-text-left { 0% { opacity: 0; transform: translateX(-55%); filter: blur(4px); } 100% { opacity: 1; transform: translateX(0); filter: blur(0); } }
  @keyframes anim3-text-right { 0% { opacity: 0; transform: translateX(55%); filter: blur(4px); } 100% { opacity: 1; transform: translateX(0); filter: blur(0); } }
  @keyframes anim3-sub { 0% { opacity: 0; transform: translateY(40%); filter: blur(6px) scale(.9); } 100% { opacity: 1; transform: translateY(0); filter: blur(0) scale(1); } }

  /* 方案 5 · 最初经典（关键帧里不用 cqw，见下方命名约定） */
  @keyframes anim5-original-logo { 0% { opacity: 0; transform: translateY(25%) scale(.94); filter: blur(10px); } 55% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
  @keyframes anim5-original-char { 0% { opacity: 0; transform: translateY(40%); filter: blur(5px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }

  /* ==================================================
     方案触发
     ================================================== */
  .play-1 .logo-icon {
    animation: anim1-icon var(--dur-icon) cubic-bezier(.16, 1, .3, 1) both;
  }
  .play-1 .icon-box {
    animation: anim1-breathe 4s ease-in-out var(--dur-icon) infinite;
  }
  .play-1 .logo-text span {
    animation: anim1-text var(--dur-text) cubic-bezier(.16, 1, .3, 1) both;
    animation-delay: calc(var(--delay-text) + var(--i) * var(--stagger-text));
  }
  .play-1 .tagline span {
    animation: anim1-text var(--dur-sub) cubic-bezier(.16, 1, .3, 1) both;
    animation-delay: calc(var(--delay-sub) + var(--i) * var(--stagger-sub));
  }

  .play-3 .logo-icon {
    animation: anim3-icon var(--dur-icon) cubic-bezier(.34, 1.56, .64, 1) both;
  }
  .play-3 .logo-text span:nth-child(odd) {
    animation: anim3-text-left var(--dur-text) cubic-bezier(.34, 1.56, .64, 1) both;
    animation-delay: calc(var(--delay-text) + var(--i) * var(--stagger-text));
  }
  .play-3 .logo-text span:nth-child(even) {
    animation: anim3-text-right var(--dur-text) cubic-bezier(.34, 1.56, .64, 1) both;
    animation-delay: calc(var(--delay-text) + var(--i) * var(--stagger-text));
  }
  .play-3 .tagline span {
    animation: anim3-sub var(--dur-sub) cubic-bezier(.16, 1, .3, 1) both;
    animation-delay: calc(var(--delay-sub) + var(--i) * var(--stagger-sub));
  }

  .play-5 .logo-wrap {
    animation: anim5-original-logo var(--dur-logo) cubic-bezier(.16, 1, .3, 1) both;
  }
  .play-5 .logo-icon, .play-5 .logo-text span { opacity: 1; animation: none; }
  .play-5 .icon-box { animation: none; }
  .play-5 .tagline span {
    animation: anim5-original-char var(--dur-sub) cubic-bezier(.16, 1, .3, 1) both;
    animation-delay: calc(var(--delay-sub) + var(--i) * var(--stagger-sub));
  }

  /* 减弱动效：直接落到终态（无限循环的光晕也要停，否则 0.01ms 一轮空转） */
  @media (prefers-reduced-motion: reduce) {
    .logo-wrap, .icon-box, .logo-icon, .logo-text span, .tagline span {
      animation-duration: .01ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
    }
  }

  /* 窄屏改为上下布局，画布保持 16:9 */
  @media (max-width: 900px) {
    body { flex-direction: column; }
    .canvas-area { padding: 16px; flex: 0 0 auto; }
    .control-panel {
      width: auto; flex: 1 1 auto; border-left: none; border-top: 1px solid #333;
      box-shadow: 0 -5px 20px rgba(0, 0, 0, .3); height: 100%;
    }
  }
</style>
</head>
<body>

  <div class="canvas-area">
    <div class="screen">
      <div class="content" id="content">
        <div class="logo-wrap">
          <span class="icon-box">
            <svg class="logo-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="gradient" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#FF3366" /><stop offset="1" stop-color="#B224EF" />
                </linearGradient>
              </defs>
              <circle class="icon-bg" cx="60" cy="60" r="56" />
              <path class="icon-stroke" d="M45 75C45 83.2843 51.7157 90 60 90C68.2843 90 75 83.2843 75 75V45C75 36.7157 68.2843 30 60 30C51.7157 30 45 36.7157 45 45V75Z" />
              <circle class="icon-dot" cx="60" cy="60" r="8" />
            </svg>
          </span>
          <div class="logo-text">
            <span style="--i:0">全</span><span style="--i:1">民</span><span style="--i:2">K</span><span style="--i:3">歌</span>
          </div>
        </div>
        <div class="tagline">
          <span style="--i:0">随</span><span style="--i:1">时</span><span style="--i:2">随</span><span style="--i:3">地</span>
          <span style="--i:4">想</span><span style="--i:5">唱</span><span style="--i:6">就</span><span style="--i:7">唱</span>
        </div>
      </div>
    </div>
  </div>

  <div class="control-panel">
    <div class="panel-title">动效参数调试</div>
    <div class="panel-desc">拖拽滑块调参（步长 100ms），松手自动重播</div>

    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-anim="1">呼吸微光</button>
      <button class="tab-btn" data-anim="3">弹性错位</button>
      <button class="tab-btn" data-anim="5">最初经典</button>
    </div>

    <!-- 方案 1 / 3 专有参数 -->
    <div id="group-icon-text">
      <div class="slider-group">
        <div class="slider-header"><span>图标出现时长</span><span class="slider-value" id="label-icon">500ms</span></div>
        <input type="range" id="slider-icon" min="100" max="3000" step="100" value="500">
      </div>
      <div class="slider-group">
        <div class="slider-header"><span>Logo 文字时长</span><span class="slider-value" id="label-text">500ms</span></div>
        <input type="range" id="slider-text" min="100" max="3000" step="100" value="500">
      </div>
      <div class="slider-group">
        <div class="slider-header"><span>图标后文字延迟</span><span class="slider-value" id="label-delay-text">0ms</span></div>
        <input type="range" id="slider-delay-text" min="0" max="2000" step="100" value="0">
      </div>
      <div class="slider-group">
        <div class="slider-header"><span>文字逐字错位</span><span class="slider-value" id="label-stagger-text">0ms</span></div>
        <input type="range" id="slider-stagger-text" min="0" max="500" step="100" value="0">
      </div>
    </div>

    <!-- 方案 5 专有参数 -->
    <div id="group-logo" style="display:none">
      <div class="slider-group">
        <div class="slider-header"><span>整体 Logo 时长</span><span class="slider-value" id="label-logo">1000ms</span></div>
        <input type="range" id="slider-logo" min="100" max="3000" step="100" value="1000">
      </div>
    </div>

    <!-- 公共参数：副标题 -->
    <div class="slider-group" style="margin-top:8px">
      <div class="slider-header"><span>副标题时长</span><span class="slider-value" id="label-sub">400ms</span></div>
      <input type="range" id="slider-sub" min="100" max="3000" step="100" value="400">
    </div>
    <div class="slider-group">
      <div class="slider-header"><span>副标题起始延迟</span><span class="slider-value" id="label-delay-sub">400ms</span></div>
      <input type="range" id="slider-delay-sub" min="0" max="3000" step="100" value="400">
    </div>
    <div class="slider-group">
      <div class="slider-header"><span>副标题逐字错位</span><span class="slider-value" id="label-stagger-sub">0ms</span></div>
      <input type="range" id="slider-stagger-sub" min="0" max="500" step="100" value="0">
    </div>

    <div class="total-duration-panel">
      <span class="total-label">预计总时长</span>
      <span class="total-value" id="total-duration">0.0s</span>
    </div>

    <button class="replay-btn" id="replayBtn">▶ 重新播放动画</button>
  </div>

<script>
(() => {
  "use strict";

  const LOGO_TEXT_COUNT = 4;   // 全民K歌
  const SUB_TEXT_COUNT  = 8;   // 随时随地想唱就唱

  const $ = id => document.getElementById(id);
  const root = document.documentElement;

  const contentTemplate = $('content').outerHTML;   // 干净副本：不含 play-N 类
  const tabBtns   = Array.from(document.querySelectorAll('.tab-btn'));
  const groupIcon = $('group-icon-text');
  const groupLogo = $('group-logo');

  let currentAnim = 1;

  /* ================= 预计总时长 =================
     三条链取结束时刻的最大值，每条链 = 延迟 +（字数-1）× 逐字错位 + 时长
  ============================================== */
  function calculateTotalDuration() {
    const durIcon    = +$('slider-icon').value;
    const durText    = +$('slider-text').value;
    const delayText  = +$('slider-delay-text').value;
    const staggerTxt = +$('slider-stagger-text').value;
    const durLogo    = +$('slider-logo').value;

    const durSub     = +$('slider-sub').value;
    const delaySub   = +$('slider-delay-sub').value;
    const staggerSub = +$('slider-stagger-sub').value;

    const subEnd = delaySub + (SUB_TEXT_COUNT - 1) * staggerSub + durSub;

    let maxDuration;
    if (currentAnim === 5) {
      maxDuration = Math.max(durLogo, subEnd);
    } else {
      const textEnd = delayText + (LOGO_TEXT_COUNT - 1) * staggerTxt + durText;
      maxDuration = Math.max(durIcon, textEnd, subEnd);
    }

    $('total-duration').innerText = (maxDuration / 1000).toFixed(1) + 's';
  }

  /* ================= 重播 =================
     CSS 动画不认「重新加同名 class」，必须换节点才会从 0 计时
  ========================================= */
  function forceReplay(animType) {
    currentAnim = Number(animType);   // tab 传进来是字符串，统一转数字，总时长分支才不会走错

    const oldContent = $('content');
    const holder = document.createElement('div');
    holder.innerHTML = contentTemplate;
    const newContent = holder.firstElementChild;

    oldContent.parentNode.replaceChild(newContent, oldContent);

    void newContent.offsetWidth;
    newContent.classList.add('play-' + currentAnim);

    tabBtns.forEach(btn => btn.classList.toggle('active', +btn.dataset.anim === currentAnim));

    // 方案 5 只调「整体 Logo」，隐藏图标 / 文字那组
    const isLogoOnly = currentAnim === 5;
    groupIcon.style.display = isLogoOnly ? 'none' : 'block';
    groupLogo.style.display = isLogoOnly ? 'block' : 'none';

    calculateTotalDuration();
  }

  tabBtns.forEach(btn => btn.addEventListener('click', () => forceReplay(btn.dataset.anim)));
  $('replayBtn').addEventListener('click', () => forceReplay(currentAnim));

  /* ================= 滑杆 → CSS 变量 =================
     拖动时立刻更新数值与总时长，停手 300ms 后再重播，避免每帧重建 DOM
  ================================================= */
  let replayTimer = null, rafId = 0;

  function bindSlider(sliderId, labelId, cssVar) {
    const slider = $(sliderId), label = $(labelId);
    slider.addEventListener('input', () => {
      label.innerText = slider.value + 'ms';
      root.style.setProperty(cssVar, slider.value + 'ms');
      calculateTotalDuration();

      clearTimeout(replayTimer);
      replayTimer = setTimeout(() => {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(() => forceReplay(currentAnim));
      }, 300);
    });
  }

  bindSlider('slider-icon',         'label-icon',         '--dur-icon');
  bindSlider('slider-text',         'label-text',         '--dur-text');
  bindSlider('slider-logo',         'label-logo',         '--dur-logo');
  bindSlider('slider-delay-text',   'label-delay-text',   '--delay-text');
  bindSlider('slider-stagger-text', 'label-stagger-text', '--stagger-text');
  bindSlider('slider-sub',          'label-sub',          '--dur-sub');
  bindSlider('slider-delay-sub',    'label-delay-sub',    '--delay-sub');
  bindSlider('slider-stagger-sub',  'label-stagger-sub',  '--stagger-sub');

  /* ================= 启动 ================= */
  forceReplay(1);
})();
</script>
</body>
</html>
