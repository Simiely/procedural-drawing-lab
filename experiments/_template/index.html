<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验模板 · 程序化作图</title>
<style>
  :root{ --bg:#10131a; --card:#181c26; --line:#262c3a; --txt:#e6e9f0; --mut:#8b94a7; --acc:#5b8cff; }
  *{ box-sizing:border-box; margin:0; }
  body{ background:var(--bg); color:var(--txt); font-family:"Segoe UI","Microsoft YaHei",sans-serif; min-height:100vh; }
  header{ padding:20px 28px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1{ font-size:18px; }
  header .mut{ color:var(--mut); font-size:13px; }
  main{ display:grid; grid-template-columns:380px 1fr; gap:0; min-height:calc(100vh - 62px); }
  #panel{ padding:20px 24px; border-right:1px solid var(--line); background:#141822; overflow:auto; }
  #panel h2{ font-size:14px; color:var(--mut); margin-bottom:14px; font-weight:600; }
  .ctrl{ margin-bottom:18px; }
  .ctrl label{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:var(--txt); }
  .ctrl label b{ color:var(--acc); font-weight:600; }
  input[type=range]{ width:100%; accent-color:var(--acc); }
  select{ width:100%; background:var(--card); color:var(--txt); border:1px solid var(--line); padding:8px; border-radius:8px; font-size:13px; font-family:inherit; }
  input[type=color]{ width:100%; height:34px; padding:2px; background:var(--card); border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .row{ display:flex; gap:10px; margin-top:6px; }
  button{ flex:1; background:var(--card); color:var(--txt); border:1px solid var(--line); padding:9px 0; border-radius:8px; cursor:pointer; font-size:13px; }
  button:hover{ border-color:var(--acc); color:var(--acc); }
  .seed-btn{ background:#20263a; border-color:#3a4363; }
  #canvasWrap{ display:flex; align-items:center; justify-content:center; padding:24px; }
  canvas{ background:#000; border-radius:10px; max-width:100%; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } #panel{ border-right:none; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>实验：样品实验名称</h1>
  <span class="mut">程序化作图前哨实验场 · 拖动参数实时调参</span>
</header>
<main>
  <aside id="panel">
    <h2>参数面板</h2>
    <div id="controls"></div>
    <div class="row">
      <button id="resetSeed" class="seed-btn">🔀 重置种子</button>
      <button id="redraw">⟳ 重绘</button>
    </div>
  </aside>
  <section id="canvasWrap"><canvas id="cv"></canvas></section>
</main>

<script>
"use strict";
// ===== 参数定义：在此声明你的可调参数 =====
// type: range(滑块)[min,max,step] | color(颜色) | select(下拉)[选项…]
// 面板会按 type 自动生成对应控件；把下面的示例换成你自己的参数
const PARAMS = {
  粒子数量:  { type:"range", min:50,  max:4000, step:50,  value:1200 },
  粒子尺寸:  { type:"range", min:0.5, max:4,    step:0.1, value:1.4 },
  配色模式:  { type:"select", options:["蓝紫","霓虹","暖橙","青绿"], value:"蓝紫" },
  点缀色:    { type:"color",  value:"#5b8cff" },
};

// ===== 初始化画布（高分屏适配） =====
const wrap = document.getElementById("canvasWrap");
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const DPR = window.devicePixelRatio || 1;
function sizeCanvas(){
  const w = Math.min(wrap.clientWidth - 48, 1100);
  const h = Math.min(window.innerHeight - 110, 800);
  cv.width = w * DPR; cv.height = h * DPR;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", ()=>{ sizeCanvas(); draw(); });

// ===== 参数面板自动生成 =====
const controls = document.getElementById("controls");
function buildPanel(){
  controls.innerHTML = "";
  for (const [name, p] of Object.entries(PARAMS)){
    const box = document.createElement("div"); box.className = "ctrl";
    const lab = document.createElement("label");
    let input;

    if (p.type === "select"){
      // 下拉：选项自带文案，不再回显数值
      lab.textContent = name + "：";
      input = document.createElement("select");
      (p.options || []).forEach(o => {
        const op = document.createElement("option");
        op.value = o; op.textContent = o;
        if (o === p.value) op.selected = true;
        input.appendChild(op);
      });
      input.addEventListener("change", ()=>{ p.value = input.value; draw(); });

    } else if (p.type === "color"){
      // 取色器：颜色本身可见，不再回显数值
      lab.textContent = name + "：";
      input = document.createElement("input");
      input.type = "color";
      input.value = p.value;
      input.addEventListener("input", ()=>{ p.value = input.value; draw(); });

    } else {
      // range：右侧实时回显数值
      lab.innerHTML = `${name}：<b id="${name}Val"></b>`;
      input = document.createElement("input");
      input.type = "range";
      input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
      input.addEventListener("input", ()=>{ p.value = +input.value; labelVal(name,p); draw(); });
    }

    box.appendChild(lab); box.appendChild(input); controls.appendChild(box);
    if (p.type === "range" || !p.type) labelVal(name, p);
  }
}
function labelVal(name,p){ const el=document.getElementById(name+"Val"); if(el) el.textContent = (Math.round(p.value*100)/100); }
document.getElementById("resetSeed").onclick = ()=>{ seed=Math.random()*1e9; draw(); };
document.getElementById("redraw").onclick = draw;

// ===== 随机种子（可复现） =====
let seed = 42;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ===== 在这里写你的绘图逻辑 =====
// 示例：三种参数类型都演示一遍（range / select / color）
const BASE_HUE = { "蓝紫": 225, "霓虹": 300, "暖橙": 28, "青绿": 165 };

function draw(){
  const W = cv.width / DPR, H = cv.height / DPR;
  ctx.clearRect(0,0,W,H);
  const rnd = mulberry32(seed);
  const count = PARAMS["粒子数量"].value;
  const size  = PARAMS["粒子尺寸"].value;
  const accent = PARAMS["点缀色"].value;
  const baseHue = BASE_HUE[PARAMS["配色模式"].value] ?? 225;

  for (let i=0;i<count;i++){
    const x = rnd()*W, y = rnd()*H;
    const isAccent = (i % 12 === 0);
    ctx.globalAlpha = isAccent ? 1 : (0.35 + rnd()*0.6);
    ctx.fillStyle = isAccent ? accent : `hsl(${baseHue + rnd()*50}, 88%, 64%)`;
    ctx.beginPath();
    ctx.arc(x, y, isAccent ? size*1.8 : size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

sizeCanvas(); buildPanel(); draw();
</script>
</body>
</html>
