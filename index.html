<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>程序化作图前哨实验场</title>
<style>
  :root{ --bg:#0e1116; --card:#171c26; --line:#262d3b; --txt:#e8ecf3; --mut:#8a94a8; --acc:#5b8cff; --acc2:#7c6bff; }
  *{ box-sizing:border-box; margin:0; }
  body{ background:var(--bg); color:var(--txt); font-family:"Segoe UI","Microsoft YaHei",sans-serif; min-height:100vh; }
  .wrap{ max-width:1200px; margin:0 auto; padding:36px 28px 60px; }
  header h1{ font-size:26px; letter-spacing:.5px; }
  header h1 span{ background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p{ color:var(--mut); margin-top:8px; font-size:14px; line-height:1.7; max-width:760px; }
  .cats{ display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 14px; }
  .cat{ padding:6px 14px; border-radius:8px; background:var(--card); border:1px solid var(--line); color:var(--acc); font-size:12px; }
  .tags{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 22px; }
  .tag{ padding:7px 16px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--mut); font-size:13px; cursor:pointer; transition:.15s; user-select:none; }
  .tag:hover{ border-color:var(--acc); color:var(--acc); }
  .tag.active{ background:var(--acc); border-color:var(--acc); color:#fff; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; text-decoration:none; color:inherit; transition:transform .15s, border-color .15s, box-shadow .15s; }
  .card:hover{ transform:translateY(-3px); border-color:var(--acc); box-shadow:0 12px 30px rgba(91,140,255,.12); }
  .thumb{ height:150px; border-radius:9px; overflow:hidden; background:#000; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card h3{ font-size:16px; }
  .card p{ color:var(--mut); font-size:13px; line-height:1.6; flex:1; }
  .meta{ display:flex; flex-wrap:wrap; gap:6px; }
  .meta .m{ font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--acc); }
  .empty{ color:var(--mut); text-align:center; padding:60px 0; display:none; }
  .count{ color:var(--mut); font-size:13px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>程序化作图 <span>前哨实验场</span></h1>
    <p>纯前端、零依赖单 HTML 的生成式绘图实验集合。每个实验打开即用，拖动参数面板实时调参、随时重置种子，作为程序化作图的技术前瞻测试场。</p>
  </header>

  <div class="cats" id="cats"></div>
  <div class="tags" id="tags"></div>
  <div class="count" id="count"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">该标签下暂无实验。</div>
</div>

<script>
// ===== 实验清单：新增实验在此加一条（含分类 + 截图路径） =====
// thumb: screenshots/<文件名>.png（存于仓库根目录 screenshots/）
const EXPERIMENTS = [
  {
    title:"流场粒子 · Flow Field",
    cat:"粒子动势",
    desc:"粒子沿确定性噪声场流动，拖出柔和丝带状轨迹。调整流场密度、噪声强度、轨迹长度与配色可切换风格。",
    tags:["粒子","噪声","动势"],
    href:"experiments/粒子动势/flow-field.html",
    thumb:"screenshots/flow-field.png"
  },
  {
    title:"星芒 · Star Spikes",
    cat:"几何生成",
    desc:"参数化星芒/芒星：尖角数量、中心圆半径、尖角长度、基部半角与内凹程度均可调，还能自定义图形与背景色。",
    tags:["几何","参数化","对称"],
    href:"experiments/几何生成/star-spikes.html",
    thumb:"screenshots/star-spikes.png"
  },
  {
    title:"雪花 · Snowflake",
    cat:"几何生成",
    desc:"参数化雪花：对称臂数、主臂/分支长度、分支张开角度与递减比例、尖端 V 形均可调，呈分形冰晶结构。",
    tags:["几何","分形","对称"],
    href:"experiments/几何生成/snowflake.html",
    thumb:"screenshots/snowflake.png"
  }
];

// 分类（导航用）+ 全部标签
const catSet = new Set(); const tagsSet = new Set();
EXPERIMENTS.forEach(e => { catSet.add(e.cat); (e.tags||[]).forEach(t=>tagsSet.add(t)); });
const cats = [...catSet];
let activeCat = "全部";
let activeTag = "全部";

function renderCats(){
  const box=document.getElementById("cats"); box.innerHTML="";
  ["全部",...cats].forEach(c=>{
    const el=document.createElement("span"); el.className="cat"; el.textContent=c;
    box.appendChild(el);
  });
}
function renderTags(){
  const box=document.getElementById("tags"); box.innerHTML="";
  ["全部",...tagsSet].forEach(t=>{
    const el=document.createElement("span"); el.className="tag"+(t===activeTag?" active":""); el.textContent=t;
    el.onclick=()=>{ activeTag=t; renderTags(); renderCards(); };
    box.appendChild(el);
  });
}
function filtered(){
  return EXPERIMENTS.filter(e=>
    (activeCat==="全部"||e.cat===activeCat) &&
    (activeTag==="全部"||(e.tags||[]).includes(activeTag))
  );
}
function renderCards(){
  const grid=document.getElementById("grid"), count=document.getElementById("count"), empty=document.getElementById("empty");
  const list=filtered();
  count.textContent=`${activeCat==="全部"?"全部分类":activeCat} · 共 ${list.length} 个实验`;
  empty.style.display=list.length?"none":"block";
  grid.innerHTML="";
  list.forEach(e=>{
    const a=document.createElement("a"); a.className="card"; a.href=e.href;
    const th=document.createElement("div"); th.className="thumb";
    const img=document.createElement("img");
    img.loading="lazy";
    if(e.thumb){ img.src=e.thumb; img.onerror=()=>{ img.style.display="none"; th.style.background="radial-gradient(circle at 30% 30%, #1b2334, #000)"; }; }
    th.appendChild(img); a.appendChild(th);
    const h=document.createElement("h3"); h.textContent=e.title; a.appendChild(h);
    const p=document.createElement("p"); p.textContent=e.desc; a.appendChild(p);
    const meta=document.createElement("div"); meta.className="meta";
    const cc=document.createElement("span"); cc.className="m"; cc.textContent=e.cat; meta.appendChild(cc);
    (e.tags||[]).forEach(t=>{ const m=document.createElement("span"); m.className="m"; m.textContent=t; meta.appendChild(m); });
    a.appendChild(meta);
    grid.appendChild(a);
  });
}

renderCats(); renderTags(); renderCards();
</script>
</body>
</html>
